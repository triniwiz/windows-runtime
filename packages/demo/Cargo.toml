[package]
name = "ns-windows-demo"
version = "0.1.0"
edition = "2021"
description = "Self-test/demo harness and native crash reporter for the NativeScript Windows standalone-engine `nativescript-windows` bin targets. Not used by the shipped napi addon/cdylib — see ns-windows-common for that."

[lib]
crate-type = ["rlib"]

[dependencies]
# Crash reporter: symbolize native faults via the host PDB.
backtrace = "0.3"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
]
