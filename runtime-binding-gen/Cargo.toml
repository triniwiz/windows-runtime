[package]
name = "runtime-binding-gen"
version = "0.1.0"
edition = "2021"
description = "Runtime Binding Generator - Runtime-phase metadata capture and JS dispatch registration"

[lib]
name = "runtime_binding_gen"
path = "src/lib.rs"

[[bin]]
name = "runtime-binding-gen"
path = "src/main.rs"

[dependencies]
ahash = { version = "0.8", features = ["serde"] }
regex = "1.10"
anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
metadata = { path = "../metadata" }

[dependencies.windows]
workspace = true
features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_System_Com",
]
